<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>弹幕净化战</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="弹幕净化战游戏画面"></canvas>

      <header class="hud" aria-live="polite">
        <div class="mode-switch" aria-label="Choose mini game">
          <button id="danmakuModeBtn" class="mode-button active" type="button" data-game="danmaku">Danmaku</button>
          <button id="dandruffModeBtn" class="mode-button" type="button" data-game="dandruff">Clean Saki</button>
        </div>
        <div class="meter">
          <span class="label">分数</span>
          <strong id="score">0</strong>
        </div>
        <div class="meter">
          <span class="label">护盾</span>
          <strong id="shield">5</strong>
        </div>
        <div class="meter">
          <span class="label">金币</span>
          <strong id="gold">0</strong>
        </div>
        <button id="shopBtn" class="icon-button" type="button" aria-label="Open outfit shop">$</button>
        <button id="leaderboardBtn" class="icon-button text-icon" type="button" aria-label="Open leaderboard">RANK</button>
        <button id="musicBtn" class="icon-button" type="button" aria-label="Toggle background music">♪</button>
        <button id="pauseBtn" class="icon-button" type="button" aria-label="暂停或继续">Ⅱ</button>
        <div class="xp-panel" aria-label="金币经验条">
          <div class="xp-header">
            <span>金币经验</span>
            <strong id="xpText">0 / 36</strong>
          </div>
          <div class="xp-track">
            <div id="xpFill" class="xp-fill"></div>
          </div>
        </div>
      </header>

      <section id="startPanel" class="modal" role="dialog" aria-modal="true">
        <div class="intro-scene">
          <div class="intro-title">
            <p class="eyebrow">PROLOGUE</p>
            <h1>Saki Takes Off</h1>
          </div>
          <div class="intro-saki" aria-hidden="true">
            <canvas id="introSaki" width="88" height="124"></canvas>
          </div>
        </div>
        <div class="conversation-frame">
          <div class="dialogue-box">
            <span id="speakerName" class="speaker">Saki</span>
            <p id="dialogueText">Hey... can you help me?</p>
          </div>
          <div id="dialogueChoices" class="choice-grid">
            <button class="choice-button" type="button" data-choice="Yes">1. Yes</button>
            <button class="choice-button" type="button" data-choice="Sure">2. Sure</button>
          </div>
          <button id="startBtn" class="primary-button hidden" type="button">Next</button>
          <div class="mouse-hint" aria-hidden="true"></div>
        </div>
      </section>

      <section id="endPanel" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-panel">
          <p class="eyebrow">CLEAR REPORT</p>
          <h2>护盾耗尽</h2>
          <p class="lede">本轮分数 <strong id="finalScore">0</strong></p>
          <div id="recordScoreBlock" class="record-score-block">
            <p id="recordScorePrompt" class="record-score-prompt">Record this score on the ranking?</p>
            <div id="recordScoreChoices" class="score-choice-row">
              <button id="submitScoreBtn" class="choice-button" type="button">Yes, record it</button>
              <button id="skipScoreBtn" class="choice-button" type="button">No, skip</button>
            </div>
            <div id="endScoreForm" class="rank-save-form hidden">
              <label class="crypto-field">
                <span>Player name</span>
                <input id="endLeaderboardName" maxlength="18" autocomplete="nickname" placeholder="Your name" />
              </label>
              <button id="endLeaderboardSubmitBtn" class="primary-button" type="button">Put Me On The Ranking</button>
            </div>
            <p id="endScoreStatus" class="end-rank-status" aria-live="polite"></p>
          </div>
          <button id="retryBtn" class="primary-button" type="button">再来一局</button>
        </div>
      </section>

      <section id="shopPanel" class="modal hidden" role="dialog" aria-modal="true" aria-label="Saki outfit shop">
        <div class="shop-panel">
          <div class="shop-header">
            <div>
              <p class="eyebrow">OUTFIT SHOP</p>
              <h2>Saki Dress Up</h2>
            </div>
            <button id="closeShopBtn" class="icon-button" type="button" aria-label="Close shop">×</button>
          </div>
          <p id="shopMessage" class="shop-message">Break danmaku to earn coins, then buy outfits here.</p>
          <div id="shopItems" class="shop-grid" aria-live="polite"></div>
        </div>
      </section>

      <section id="leaderboardPanel" class="modal hidden" role="dialog" aria-modal="true" aria-label="Shooting game leaderboard">
        <div class="leaderboard-panel">
          <div class="shop-header">
            <div>
              <p class="eyebrow">DANMAKU RANK</p>
              <h2>Highest Scores</h2>
            </div>
            <button id="closeLeaderboardBtn" class="icon-button" type="button" aria-label="Close leaderboard">×</button>
          </div>
          <p id="leaderboardStatus" class="shop-message">Top shooting scores will appear here.</p>
          <div class="leaderboard-submit">
            <label class="crypto-field">
              <span>Player name</span>
              <input id="leaderboardName" maxlength="18" autocomplete="nickname" placeholder="Your name" />
            </label>
            <button id="leaderboardSubmitBtn" class="primary-button" type="button">Submit Current Score</button>
          </div>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="game.js" defer></script>
  </body>
</html>
